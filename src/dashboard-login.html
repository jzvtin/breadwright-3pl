<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breadwright 3PL — Status</title>
<style>
 body{font:15px/1.5 system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#3a2a1a;color:#2a2a2a}
 .box{background:#fff;padding:32px;border-radius:14px;max-width:340px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
 h1{font-size:18px;margin:0 0 4px}.sub{color:#8a7f6a;font-size:13px;margin:0 0 20px}
 input{width:100%;padding:10px 12px;border:1px solid #d8d0c0;border-radius:8px;font:inherit;margin-bottom:12px}
 button{width:100%;background:#7a5c34;color:#fff;border:0;padding:11px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
 .err{color:#b23b3b;font-size:13px;margin-bottom:10px}
</style></head><body>
 <form class="box" method="post" action="/">
  <h1>🍞 Breadwright 3PL</h1>
  <p class="sub">Live integration status</p>
  <!--ERR-->
  <input type="password" name="pw" placeholder="Password" autofocus>
  <button type="submit">View status</button>
 </form>
</body></html>
